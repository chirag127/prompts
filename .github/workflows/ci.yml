name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if grep -r "mcp_k1\|43c007274e4c\|whyiswhen1234\|5c1be675-6c37" library/ docs/ 2>/dev/null; then
            echo "ERROR: secrets detected in library or docs"
            exit 1
          fi
          echo "No secrets found."
